*{box-sizing:border-box}

.cleaner{display:flex;flex-direction:column;min-height:0;flex:1;padding:var(--space-24) var(--space-24) 0}

.workflow-body{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-md) 10px 0 0}
